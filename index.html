AEQRAEQRBEEXF1dTWExRSG/wcRteLEWlNS2gAAAABJRU5ErkJggg=="><h1>Friday Site Check</h1><div class="muted">Walk the site. Tick it if it is right. If not, record it in Actions.</div></header><form id="form"><section><h2>Inspection details</h2><div class="inside grid"><label class="full">Site address *<input id="site" required autocomplete="street-address" placeholder="Street address, suburb"></label><label>Inspection date *<input id="date" type="date" required></label><label>Week ending<input id="week" type="date"></label><label>Completed by<input id="completed"></label><label>Supervisor<input id="supervisor"></label><label>Weather<input id="weather"></label><label>On site (no.)<input id="people" type="number" min="0"></label></div></section><div id="checks"></div><section><h2>Actions — anything not ticked</h2><div class="inside"><div id="actions"></div><button type="button" class="secondary" id="addAction">+ Add action</button></div></section><section><h2>Overall site rating & sign-off</h2><div class="inside"><label>Overall rating<select id="rating"><option value="">Select rating</option><option>Good</option><option>Fair: fix this week</option><option>Poor: urgent action</option><option>Stop work: escalate now</option></select></label><label>Supervisor name<input id="signedName"></label><label style="margin:12px 0 4px">Supervisor signature</label><canvas id="signature" width="900" height="280"></canvas><button type="button" class="secondary" id="clearSig">Clear signature</button></div></section><section><h2>Site inspection photos</h2><div class="inside grid" id="photos"></div></section><div class="bar"><div class="muted" id="filename"></div><div class="tools"><button type="submit" id="generate">Generate PDF</button><button type="button" class="secondary" id="share" disabled>Share / Save to Dropbox</button></div><div id="status" class="muted" role="status">Your inspection stays on this device until you save or share it.</div><button type="button" class="secondary" id="rese const $=id=>document.getElementById(id), groups=[['SITE & ACCESS','Fencing, gates and locks secure','Signage displayed and legible','Walkways clear, trip hazards removed','No sign of break-in or unauthorised entry'],['SAFETY','Inductions and sign-in sheets up to date','SWMS current for all high-risk work','PPE worn by everyone','Toolbox talk held, attendance recorded','Incidents and near misses logged','Barricades and exclusion zones in place','First aid kit and extinguishers in date','Emergency plan and muster point displayed'],['ELECTRICAL & PLANT','Test and tag current, leads off the ground','RCDs in place and tested','Pre-starts done, operators licensed','Scaffold and ladders tagged and safe'],['HEIGHTS & EXCAVATIONS','Edge protection up, openings covered','Excavations shored or barricaded','Underground services located and marked'],['HOUSEKEEPING & WELFARE','Toilets, lunchroom, water and handwash OK','Bins not overflowing, offcuts cleared','Materials stacked safely and secured'],['ENVIRONMENT','Silt fences and drain protection intact','Dust, noise and work hours controlled','Spill kit stocked, chemicals bunded, SDS on site','Roads and footpaths clean'],['QUALITY & PROGRAM','Work matches current drawings','Hold points signed, inspections booked','Defects recorded and passed on','Progress photos taken','Site diary up to date, program on track'],['PAPERWORK & PUBLIC','Permits current (hot work, crane, road etc.)','Sub insurances and licences current','Dockets filed, variations raised','Neighbour complaints logged and actioned']];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,fmt=d=>d?d.split('-').reverse().join('-'):'';function setWeek(){let d=new Date($('date').value+'T12:00:00');d.setDate(d.getDate()+(5-d.getDay()+7)%7);$('week').value=iso(d)}$('date').value=iso(new Date());setWeek();$('date').onchange=setWeek;

let imgs=Array(8).fill(null), pending=0;for(let i=0;i<8;i++){let el=document.createElement('div');el.className='photo';el.innerHTML=`<strong>Photo ${i+1}</strong><div id="preview${i}" class="placeholder">No photo added</div><div class="tools"><label class="pick">Camera<input type="file" accept="image/*" capture="environment"></label><label class="pick secondary">Gallery<input type="file" accept="image/*"></label><button type="button" class="danger">Remove</button></div><label>Location / unit<input id="loc${i}"></label><label>Description / comments<textarea id="comment${i}"></textarea></label>`;el.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async()=>{let f=inp.files[0];if(!f)return;pending++;try{let url=URL.createObjectURL(f),im=new Image();im.src=url;await im.decode();let c=document.createElement('canvas'),s=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));let x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);let photo=new Image();photo.src=c.toDataURL('image/jpeg',.86);await photo.decode();imgs[i]=photo;$('preview'+i).replaceChildren(photo);$('preview'+i).className='';invalidate()}catch(e){alert('Could not open this image. Try a JPEG or PNG.')}finally{pending--;inp.value=''}});el.querySelector('button').onclick=()=>{imgs[i]=null;$('preview'+i).textContent='No photo added';$('preview'+i).className='placeholder';invalidate()};$('photos').append(el)}
let sig=$('signature'),sx=sig.getContext('2d'),drawing=false,hasSig=false;function pos(e){let r=sig.getBoundingClientRect();return [(e.clientX-r.left)*sig.width/r.width,(e.clientY-r.top)*sig.height/r.height]}sig.onpointerdown=e=>{sig.setPointerCapture(e.pointerId);drawing=true;let p=pos(e);sx.beginPath();sx.moveTo(...p);sx.lineTo(p[0]+.1,p[1]+.1);sx.strokeStyle='#18323a';sx.lineWidth=4;sx.lineCap='round';sx.stroke();hasSig=true;invalidate()};sig.onpointermove=e=>{if(drawing){sx.lineTo(...pos(e));sx.stroke()}};sig.onpointerup=sig.onpointercancel=()=>drawing=false;$('clearSig').onclick=()=>{sx.clearRect(0,0,sig.width,sig.height);hasSig=false;invalidate()};
let result=null;function name(){return `Friday Site Check - ${($('site').value.trim()||'Site address').replace(/[\\/:*?"<>|]/g,'-').slice(0,150)} - ${fmt($('date').value)}.pdf`}function invalidate(){result=null;$('share').disabled=true;$('filename').textContent=name();$('status').textContent='Generate a new PDF after changes.'}$('form').addEventListener('input',invalidate);invalidate();$('reset').onclick=()=>{if(confirm('Clear this inspection? Save your completed PDF first.'))location.reload()};

const W=794,H=1123, scale=2, pages=[];let cv,ctx,y;const teal='#397d80',dark='#18323a';function txt(s,x,yy,size=14,bold=false,col=dark){ctx.font=`${bold?'bold ':''}${size}px Arial`;ctx.fillStyle=col;ctx.fillText(String(s),x,yy)}function rect(x,yy,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,yy,w,h)}function line(x,yy,w){rect(x,yy,w,1,'#c5d2d4')}function wrap(s,width,size=14){ctx.font=`${size}px Arial`;let out=[];for(let paragraph of String(s||'').split('\n')){let a='';for(let word of paragraph.split(/\s+/)){if(ctx.measureText(word).width>width){for(let ch of word){if(ctx.measureText(a+ch).width>width){out.push(a);a=''}a+=ch}a+=' ';continue}if(a&&ctx.measureText(a+' '+word).width>width){out.push(a);a=word}else a+=(a?' ':'')+word}out.push(a)}return out}function newPage(title){cv=document.createElement('canvas');cv.width=W*scale;cv.height=H*scale;ctx=cv.getContext('2d');ctx.scale(scale,scale);rect(0,0,W,H,'white');let im=$('brand');ctx.drawImage(im,30,15,734,734*im.naturalHeight/im.naturalWidth);line(30,163,734);txt(title,30,190,25,true,teal);y=214;pages.push(cv)}function need(h,title='FRIDAY SITE CHECK — CONTINUED'){if(y+h>1060)newPage(title)}function band(s){need(35);rect(30,y,734,25,teal);txt(s,38,y+18,14,true,'white');y+=30}function para(s,size=14){let lines=wrap(s,722,size);for(let t of lines){need(size+6);txt(t,36,y+size,size);y+=size+6}}function detail(k,v){para(k+': '+(v||'—'))}function fitImage(im,x,yy,w,h){let r=Math.min(w/im.width,h/im.height),iw=im.width*r,ih=im.height*r;ctx.drawImage(im,x+(w-iw)/2,yy+(h-ih)/2,iw,ih)}
async function render(){await $('brand').decode();pages.length=0;newPage('FRIDAY SITE CHECK');detail('Site address',$('site').value);detail('Inspection date',fmt($('date').value)+'     |     Week ending: '+fmt($('week').value));detail('Completed by',$('completed').value+'     |     Supervisor: '+$('supervisor').value);detail('Weather',$('weather').value+'     |     On site: '+$('people').value);y+=8;
